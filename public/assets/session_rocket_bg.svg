<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="cardGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#145d56" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#0b3837" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#072224" stop-opacity="0.98" />
    </radialGradient>

    <!-- Graphic Stroke & Fill Gradients -->
    <linearGradient id="rocketTrail" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#22cfb8" stop-opacity="0.02" />
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38eed9" stop-opacity="0.32" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#196b63" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#269b8f" stop-opacity="0.22" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Base Background Fill -->
  <rect width="1400" height="900" fill="url(#cardGlow)" />

  <!-- Ambient Light Halos -->
  <circle cx="720" cy="420" r="340" fill="#20cfb8" fill-opacity="0.07" filter="url(#softGlow)" />
  <circle cx="950" cy="300" r="260" fill="#14b8a6" fill-opacity="0.05" filter="url(#softGlow)" />

  <!-- ================= UPWARD TRACTION ARROW ================= -->
  <g transform="translate(480, 160)" opacity="0.85">
    <!-- Large Upward Growth Arrow pointing northeast -->
    <path d="M-80 540 L180 180 L140 160 L320 80 L300 280 L250 250 L-10 600 Z" 
          fill="url(#arrowGrad)" 
          stroke="#2dd4bf" 
          stroke-opacity="0.14" 
          stroke-width="2" />
  </g>

  <!-- ================= LAUNCH ROCKET ILLUSTRATION ================= -->
  <!-- Positioned in the center-back between the left text and right CAD window -->
  <g transform="translate(680, 420) rotate(-38)" opacity="0.9">
    <!-- Rocket Exhaust Trails / Thrust Particles -->
    <path d="M-30 260 Q0 380 0 460 Q0 380 30 260 Z" fill="url(#rocketTrail)" filter="url(#softGlow)" />
    <path d="M-15 250 L0 360 L15 250 Z" fill="#38eed9" fill-opacity="0.25" />
    
    <!-- Thrust Ring Exhaust shock diamonds -->
    <ellipse cx="0" cy="270" rx="16" ry="6" fill="#38eed9" fill-opacity="0.3" />
    <ellipse cx="0" cy="310" rx="12" ry="4" fill="#38eed9" fill-opacity="0.2" />
    <ellipse cx="0" cy="360" rx="8" ry="3" fill="#38eed9" fill-opacity="0.15" />

    <!-- Left Stabilization Fin -->
    <path d="M-50 160 L-110 240 L-50 220 Z" 
          fill="#1b6e67" 
          fill-opacity="0.35" 
          stroke="#2dd4bf" 
          stroke-opacity="0.3" 
          stroke-width="2.5" />

    <!-- Right Stabilization Fin -->
    <path d="M50 160 L110 240 L50 220 Z" 
          fill="#1b6e67" 
          fill-opacity="0.35" 
          stroke="#2dd4bf" 
          stroke-opacity="0.3" 
          stroke-width="2.5" />

    <!-- Main Rocket Fuselage Body -->
    <path d="M0 -180 C80 -60 70 160 50 230 L-50 230 C-70 160 -80 -60 0 -180 Z" 
          fill="#17635c" 
          fill-opacity="0.4" 
          stroke="#38eed9" 
          stroke-opacity="0.35" 
          stroke-width="3" />

    <!-- Nose Cone Cap -->
    <path d="M0 -180 C40 -120 40 -80 0 -80 C-40 -80 -40 -120 0 -180 Z" 
          fill="#22cfb8" 
          fill-opacity="0.25" 
          stroke="#38eed9" 
          stroke-opacity="0.4" 
          stroke-width="2" />

    <!-- Center Cockpit Porthole / Window -->
    <circle cx="0" cy="10" r="32" 
            fill="#092d2e" 
            fill-opacity="0.8" 
            stroke="#38eed9" 
            stroke-opacity="0.5" 
            stroke-width="3.5" />
    <circle cx="0" cy="10" r="22" 
            fill="#22cfb8" 
            fill-opacity="0.2" 
            stroke="#38eed9" 
            stroke-opacity="0.25" 
            stroke-width="1.5" />
    <!-- Window specular reflection -->
    <path d="M-10 2 A14 14 0 0 1 10 -6" 
          stroke="#ffffff" 
          stroke-opacity="0.5" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Fuselage Body Seam Lines -->
    <line x1="-55" y1="120" x2="55" y2="120" stroke="#38eed9" stroke-opacity="0.2" stroke-width="2" />
    <line x1="-48" y1="180" x2="48" y2="180" stroke="#38eed9" stroke-opacity="0.2" stroke-width="2" />
    
    <!-- Vertical Center Guideline -->
    <line x1="0" y1="-80" x2="0" y2="230" stroke="#2dd4bf" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 4" />
  </g>

  <!-- Speed Lines & Ambient Sparkles -->
  <g opacity="0.4" stroke="#38eed9" stroke-width="1.5" stroke-linecap="round">
    <line x1="380" y1="520" x2="440" y2="440" stroke-opacity="0.25" />
    <line x1="520" y1="620" x2="590" y2="530" stroke-opacity="0.3" />
    <line x1="820" y1="240" x2="900" y2="140" stroke-opacity="0.4" stroke-width="2" />
    <line x1="740" y1="200" x2="800" y2="120" stroke-opacity="0.2" />
  </g>

  <!-- Floating Sparkle Stars -->
  <g fill="#38eed9">
    <circle cx="420" cy="280" r="2" fill-opacity="0.6" />
    <circle cx="780" cy="180" r="2.5" fill-opacity="0.7" />
    <circle cx="610" cy="380" r="1.5" fill-opacity="0.5" />
    <circle cx="890" cy="240" r="3" fill-opacity="0.8" />
    <circle cx="940" cy="380" r="2" fill-opacity="0.5" />
  </g>
</svg>
